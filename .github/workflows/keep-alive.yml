name: Keep API awake

# Render's free tier sleeps after 15 minutes idle; ping it so users don't hit a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://job-application-tracker-wbky.onrender.com/api/health
