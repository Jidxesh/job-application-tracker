server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${SPRING_DATASOURCE_USERNAME:jidnesh}
    password: ${SPRING_DATASOURCE_PASSWORD:devpass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
    properties:
      hibernate.format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-min-32-bytes-long}
    expiration-ms: 86400000
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5-5}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
